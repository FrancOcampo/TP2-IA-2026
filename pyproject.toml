[project]
name = "tp2-ia-2026"
version = "0.1.0"
description = "Sistema multiagente de soporte a la decisión clínica para seguimiento de diabetes tipo 2"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "faker>=37.0.0",
    "gradio>=6.18.0",
    "langchain>=1.3.9",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-google-genai>=2.0.0",
    "langchain-openai>=1.3.2",
    "langgraph>=1.2.5",
    "ollama>=0.6.2",
    "pydantic>=2.13.4",
    "pymongo>=4.10.0",
    "python-dotenv>=1.2.2",
    "streamlit>=1.58.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: pruebas que requieren infraestructura externa (MongoDB + Ollama + ChromaDB)",
    "llm: pruebas estocásticas que invocan el LLM real (requieren API key); ver docs/tests.md",
]
